# Levanta los tres servicios del monorepo: base de datos, backend FastAPI y
# frontend Next.js (con su BFF).
#
#   ./scripts/dev.sh     -> modo desarrollo: código montado, hot-reload.
#   ./scripts/build.sh   -> modo producción: imágenes compiladas, sin mounts.
#
# Variables compartidas en `.env` (copiá de `.env.example`).

name: proptech

# --- Variables comunes a los servicios ---
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-proptech}:${POSTGRES_PASSWORD:-proptech}@db:5432/${POSTGRES_DB:-proptech}
  # Cuentas sembradas al primer arranque (sobreescribibles en .env).
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@proptech.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
  OWNER_EMAIL: ${OWNER_EMAIL:-dueno@proptech.local}
  OWNER_PASSWORD: ${OWNER_PASSWORD:-dueno12345}
  AGENT_EMAIL: ${AGENT_EMAIL:-agente@proptech.local}
  AGENT_PASSWORD: ${AGENT_PASSWORD:-agente12345}
  SEEKER_EMAIL: ${SEEKER_EMAIL:-buscador@proptech.local}
  SEEKER_PASSWORD: ${SEEKER_PASSWORD:-buscador12345}
  # Almacenamiento local de archivos (SeaweedFS, open source): el backend
  # habla por la red interna; el navegador usa la URL pública.
  STORAGE_ENDPOINT: http://seaweedfs:8888
  STORAGE_BUCKET: ${STORAGE_BUCKET:-proptech}
  STORAGE_PUBLIC_URL: http://localhost:${STORAGE_PORT:-8888}

x-frontend-env: &frontend-env
  # El BFF llama al backend por el nombre de red del compose.
  BACKEND_URL: http://backend:8000

services:
  # --- Base de datos relacional ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proptech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proptech}
      POSTGRES_DB: ${POSTGRES_DB:-proptech}
    volumes:
      - datos_db:/var/lib/postgresql/data
    ports:
      # Publicado solo para inspeccionar la base con DBeaver/psql. Se cambia con
      # POSTGRES_PORT en .env: el 5432 del host suele estar ocupado por un
      # PostgreSQL instalado a mano, así que por defecto usamos 5433.
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proptech} -d ${POSTGRES_DB:-proptech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Almacenamiento local de archivos (fotos y videos) ---
  # SeaweedFS (open source, Apache 2.0): servidor de archivos S3-compatible.
  # El backend sube por su API HTTP (filer) y el navegador lee por la URL pública.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: >
      server -dir=/data -master.port=9333 -volume.port=8080
      -filer.port=8888 -s3.port=8333 -s3
    volumes:
      - datos_media:/data
    ports:
      # 8888: filer público (fotos/videos que ve el navegador).
      - "${STORAGE_PORT:-8888}:8888"
      # 8333: API S3 (opcional, por si se quiere compatibilidad S3).
      - "${STORAGE_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --- Backend FastAPI ---
  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # En dev se monta el código: los cambios de Python se ven al instante.
      # El bind incluye `data/mock_properties.json` (semilla inmutable que la app
      # lee para cargar la base vacía) y `artifacts/` (modelo entrenado, para no
      # reentrenar en cada arranque).
      - ./backend:/app

  # --- Frontend Next.js (BFF) ---
  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment: *frontend-env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # node_modules NO se monta desde el host: vive en el contenedor
      # (los binarios de macOS no sirven dentro de Linux).
      - node_modules:/app/node_modules
      - .next:/app/.next

volumes:
  datos_db:
  datos_media:
  node_modules:
  .next:
